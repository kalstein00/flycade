[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flycade"
version = "0.1.0"
description = "Local NES environment validation for connectome experiments"
requires-python = ">=3.12,<3.13"
dependencies = ["stable-retro==1.0.1", "gymnasium==1.4.0", "numpy==2.5.3", "pillow==12.3.0"]

[project.scripts]
flycade = "flycade.cli:main"

[project.optional-dependencies]
graph = [
    "duckdb==1.4.4",
    "pyarrow==23.0.1",
]
train = [
    "torch==2.10.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "mypy==2.4.0"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
