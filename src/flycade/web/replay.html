<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flycade · 평가 영상과 회로 이력</title><link rel="stylesheet" href="/live.css"><link rel="stylesheet" href="/replay.css"><script defer src="/inspector.js"></script><script defer src="/replay.js"></script></head>
<body><header><h1>평가 영상과 회로 이력</h1><a id="compare-link" href="/compare">평가 비교로 돌아가기</a></header>
<div class="stream-controls"><label for="run-choice">Run</label><select id="run-choice"></select><label for="evaluation-choice">평가본</label><select id="evaluation-choice"></select><label for="mode-choice">보기</label><select id="mode-choice"><option value="recorded">기록 영상과 관찰 이력</option><option value="live">고정 평가의 최신 관측</option></select><button id="reload" type="button">목록 새로고침</button></div>
<p id="replay-status" role="status">평가 기록을 불러오는 중입니다.</p><p class="replay-note">최신 평가 관측도 첫 에피소드의 짧은 영상 구간만 제공하며, 이후에는 마지막 표본을 표시합니다. 관찰 간격은 게임 시간 약 ⅓초, 영상은 12 fps입니다. 영상 시점 직전 표본만 짧게 유지하며 보간하지 않습니다. 영상 일시정지·탐색은 trainer를 중단하거나 변경하지 않습니다.</p>
<main class="observation replay-grid"><section class="game panel"><h2 id="playback-mode">평가 기록 영상</h2><video id="replay-video" controls preload="metadata" aria-label="회로 이력과 연결된 평가 영상"></video><div id="live-image" hidden></div><p id="sample-identity" class="identifier"></p><p id="sample-time"></p><details><summary>Run·평가본·관찰 범위</summary><p id="replay-identity" class="identifier"></p><p id="replay-contract"></p></details></section><div id="replay-panels"></div></main>
</body></html>
